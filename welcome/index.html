<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Рядом — ваш план для жизни и учебы в России</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17213b;background:#eaf0fa;font-synthesis:none;--blue:#2451d9;--muted:#626e85}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;border:0;min-height:44px}button:focus-visible,input:focus-visible{outline:3px solid #78a6ff;outline-offset:4px}.app{max-width:430px;margin:auto;background:#f7f9ff;min-height:100dvh;display:flex;flex-direction:column}header{padding:14px 24px 6px;padding-top:max(14px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:9px;font-size:21px;font-weight:750;letter-spacing:-.6px}.brand img{width:33px;height:33px}.languages{padding:3px;display:flex;background:#eaf0fc;border:1px solid #dce5f8;border-radius:14px}.languages button{width:44px;background:transparent;color:#526482;font-size:12px;border-radius:10px}.languages button[aria-pressed=true]{background:#fff;color:var(--blue);box-shadow:0 2px 6px #173a8210}main{display:flex;flex:1;flex-direction:column;padding:31px 24px 22px;padding-bottom:max(22px,env(safe-area-inset-bottom))}.eyebrow{color:var(--blue);font-size:12px;font-weight:650;letter-spacing:.3px;margin:0 0 14px;display:flex;align-items:center;gap:8px}.eyebrow:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--blue)}h1{font-size:36px;line-height:1.13;letter-spacing:-1.4px;margin:0;font-weight:750}h1 em{font-style:normal;color:var(--blue)}.lead{font-size:15px;line-height:1.6;color:var(--muted);margin:17px 0 0;max-width:345px}.preview{margin:26px 0 23px;padding:19px 18px 17px;border:1px solid #dce6fa;background:linear-gradient(145deg,#edf3ff,#f1f6ff);border-radius:23px;position:relative}.preview-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:17px;font-size:14px;font-weight:650}.tag{font-size:10px;letter-spacing:.2px;font-weight:500;color:#546789;background:#ffffffb8;border:1px solid #dce6f7;padding:5px 8px;border-radius:20px}.route{position:relative;display:grid;gap:12px}.route:before{content:"";position:absolute;top:17px;bottom:18px;left:12px;width:1px;background:#b9cbed}.route-row{display:flex;align-items:center;gap:12px;position:relative}.dot{flex:none;width:25px;height:25px;border-radius:50%;background:#edf3ff;border:1px solid #a8bce1;display:grid;place-items:center;color:#6680ac;font-size:11px}.route-copy{font-size:13px;color:#566b8b}.current{background:var(--blue);color:#fff;border-radius:14px;padding:14px 12px;margin-left:-1px;box-shadow:0 5px 12px #2451d91a;gap:12px}.current .dot{width:25px;height:25px;background:#fff;border:0;color:var(--blue);font-weight:700}.current strong{font-size:14px;display:block;line-height:1.3}.current small{display:block;font-size:11px;color:#dce6ff;margin-top:4px}.preview-note{font-size:11px;line-height:1.45;color:#667995;margin:14px 0 0}.intro{margin:0;font-size:15px;line-height:1.55}.intro strong{font-weight:650}.footer{margin-top:auto;padding-top:25px}.primary{width:100%;border-radius:15px;background:var(--blue);color:white;min-height:56px;font-size:15px;font-weight:650;padding:14px 16px;box-shadow:0 6px 16px #2451d91a}.primary:hover{background:#1b43be}.primary:disabled{background:#8a9fe7;cursor:default;box-shadow:none}.footnote{text-align:center;color:var(--muted);font-size:11px;margin:12px 0 0;line-height:1.5}.back{padding:0;color:#566b8b;background:transparent;font-size:13px;margin:-15px 0 15px;align-self:flex-start}.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.meta span:first-child{color:var(--blue)}.progress{display:flex;gap:5px;margin:13px 0 30px}.progress i{height:3px;background:#dfe6f4;flex:1;border-radius:4px}.progress i:first-child{background:var(--blue)}.question h1{font-size:28px;line-height:1.2;letter-spacing:-.8px}.options{border:0;padding:0;margin:26px 0 0;display:grid;gap:14px}.option{display:flex;gap:12px;align-items:center;min-height:84px;padding:17px 15px;background:#fff;border:1px solid #dfe6f4;border-radius:17px;cursor:pointer}.option:has(input:checked){border-color:var(--blue);background:#edf3ff}.option input{width:20px;height:20px;accent-color:var(--blue);flex:none;margin:0}.option strong{display:block;font-size:14px}.option small{display:block;color:var(--muted);font-size:12px;line-height:1.5;margin-top:5px}.hint{font-size:12px;color:var(--muted);line-height:1.6;margin-top:20px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.boundary{font-size:13px;color:var(--muted);line-height:1.6;padding:15px;background:#edf3ff;border-radius:14px;margin-top:20px}@media(min-width:600px){body{padding:24px}.app{min-height:820px;border:1px solid #dbe4f5;border-radius:28px;overflow:hidden;box-shadow:0 20px 80px #1d3c6810}}@media(max-width:350px){header{padding-left:18px;padding-right:18px}main{padding:24px 18px 20px}h1{font-size:31px}.preview{padding:16px 13px;margin:22px 0 20px}.lead,.intro{font-size:14px}.footnote{font-size:10px}}@media(prefers-reduced-motion:no-preference){main{animation:appear .28s ease-out}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}}

/* Scoped preview component: no changes to welcome shell, title, copy or CTA. */
.rp{--rp-border:#e1e6ef;--rp-soft:#eff5ff;--rp-muted:#626e85;margin:26px 0 23px;background:#fff;border:1px solid var(--rp-border);border-radius:16px;box-shadow:0 1px 3px #17213b06;overflow:hidden;font-size:13px;line-height:1.4}
.rp *{box-sizing:border-box}.rp h2,.rp h3,.rp p{margin:0}.rp-head{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:13px 16px 10px}.rp h2{font-size:14px;line-height:1.4;letter-spacing:-.2px;font-weight:650}.rp-badge{border:1px solid var(--rp-border);border-radius:6px;padding:3px 6px;color:#58677f;font-size:10px;line-height:1.3;font-weight:500;flex-shrink:0;background:white}.rp-foot{border-top:1px solid var(--rp-border);padding:8px 16px;color:var(--rp-muted);font-size:11px;line-height:1.45;background:#fbfcff}.rp-icon{width:28px;height:28px;background:#eef3fd;color:#2451d9;display:grid;place-items:center;border-radius:8px;flex-shrink:0}.rp svg{width:17px;height:17px;flex-shrink:0}.rp-label{display:block;font-size:10px;line-height:1.4;font-weight:500;letter-spacing:.1px}.rp-action{margin:0 12px 12px;padding:13px 14px;background:#2451d9;color:white;border-radius:11px}.rp-action .rp-label{color:#e4ecff;margin-bottom:5px}.rp-action h3{font-size:15px;line-height:1.35;font-weight:650;letter-spacing:-.15px}.rp-action p{font-size:11px;line-height:1.45;color:#e4ecff;margin-top:5px}.rp-stage{font-size:12px;font-weight:600;line-height:1.4}.rp-sub{display:block;font-size:10px;color:var(--rp-muted);font-weight:400;line-height:1.4;margin-top:2px}.rp-active-label{color:#2451d9}.rp-dot{width:11px;height:11px;border:1px solid #a8b7d0;border-radius:50%;background:#fff;flex:none;z-index:1}.rp-on .rp-dot{background:#2451d9;border:2px solid #fff;outline:1px solid #2451d9}.rp-list{margin:0;padding:0;list-style:none}
/* A: hero and stages remain two distinct layers, as in the application. */
.rp-a .rp-list{position:relative;margin:0 12px 12px;padding-left:19px;display:grid;gap:5px}.rp-a .rp-list:before{content:'';position:absolute;left:5px;top:23px;bottom:23px;width:1px;background:#cbd7e9}.rp-a .rp-row{position:relative;display:flex;align-items:center;gap:9px;padding:8px 9px;border:1px solid #e6eaf1;border-radius:9px;min-height:44px}.rp-a .rp-dot{position:absolute;left:-20px}.rp-a .rp-on{background:var(--rp-soft);border-color:#b6cdf8}.rp-a .rp-on .rp-sub{color:#2451d9}.rp-a .rp-icon{width:25px;height:25px;border-radius:7px}.rp-a .rp-icon svg{width:16px;height:16px}
.rp-a .rp-action{padding:12px 14px;margin-bottom:10px}.rp-a .rp-list{margin-bottom:10px}
/* B: stage hierarchy first, illustrative action nested in the active stage. */
.rp-b .rp-list{margin:0 16px 14px;padding-left:22px;position:relative}.rp-b .rp-list:before{content:'';position:absolute;top:19px;bottom:19px;left:5px;width:1px;background:#ccd8eb}.rp-b .rp-row{position:relative;padding:9px 0}.rp-b .rp-dot{position:absolute;left:-22px;top:15px}.rp-b .rp-row-title{display:flex;align-items:center;gap:9px}.rp-b .rp-on{margin:2px 0;padding:12px;border:1px solid #b6cdf8;border-radius:11px;background:var(--rp-soft)}.rp-b .rp-on .rp-dot{top:22px}.rp-b .rp-detail{background:#fff;border:1px solid #dce5f4;border-radius:8px;padding:10px;margin-top:10px}.rp-b .rp-detail .rp-label{color:#626e85;margin-bottom:4px}.rp-b .rp-detail strong{font-size:12px;line-height:1.45;display:block}.rp-b .rp-detail p{font-size:10px;color:#626e85;margin-top:5px;line-height:1.5}
/* C: low-height Item/Separator composition, no nesting of cards. */
.rp-c .rp-list{padding:0 16px}.rp-c .rp-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #e9edf3}.rp-c .rp-row:last-child{border:0}.rp-c .rp-on .rp-stage{color:#2451d9}.rp-c .rp-stage-copy{flex:1}.rp-c .rp-on .rp-icon{background:#e2ecff}.rp-c .rp-next{border-top:1px solid var(--rp-border);padding:13px 16px;background:#f3f7ff;display:flex;gap:10px}.rp-c .rp-next:before{content:'';width:3px;align-self:stretch;flex:none;background:#2451d9;border-radius:4px}.rp-c .rp-next .rp-label{color:#2451d9;margin-bottom:4px}.rp-c .rp-next strong{font-size:13px;line-height:1.4;display:block}.rp-c .rp-next p{font-size:10px;line-height:1.5;margin-top:4px;color:#626e85}
/* D: disclosures reveal examples; opening a section does not change stage. */
.rp-d .rp-disclosures{margin:0 12px 12px}.rp-d details{border:1px solid #e3e8f1;border-radius:10px;margin-top:6px;overflow:hidden}.rp-d summary{list-style:none;display:flex;gap:9px;align-items:center;padding:10px;min-height:48px;cursor:pointer}.rp-d summary::-webkit-details-marker{display:none}.rp-d .rp-stage-copy{flex:1;min-width:0}.rp-d .rp-chevron{width:14px;height:14px;color:#71809a;transition:transform .15s}.rp-d details[open] .rp-chevron{transform:rotate(180deg)}.rp-d details.rp-on{border-color:#b6cdf8}.rp-d details.rp-on summary{background:var(--rp-soft)}.rp-d .rp-detail{padding:10px 12px;border-top:1px solid #e3e8f1;background:#fcfdff}.rp-d .rp-detail .rp-label{color:#626e85;margin-bottom:5px}.rp-d .rp-detail strong{font-size:12px;display:block;line-height:1.5}.rp-d .rp-detail p{font-size:10px;line-height:1.5;margin-top:4px;color:#626e85}.rp-d summary:focus-visible{outline:3px solid #78a6ff;outline-offset:-3px}
@media(max-width:350px){.rp{margin-top:22px;margin-bottom:20px}.rp-head{padding-left:12px;padding-right:12px}.rp h2{font-size:13px}.rp-action h3{font-size:14px}.rp-stage{font-size:11px}.rp-foot{padding-left:12px;padding-right:12px}}
html.block-only,html.block-only body{background:transparent}html.block-only body{padding:0}html.block-only .app{border:0;border-radius:0;box-shadow:none;background:transparent;min-height:0;max-width:none}html.block-only header,html.block-only main>:not(.rp){display:none}html.block-only main{padding:0;animation:none}html.block-only .rp{margin:0}
@media(prefers-reduced-motion:reduce){.rp-d .rp-chevron{transition:none}}

.rp-a .rp-done{background:transparent;border-color:#e6eaf1}.rp-a .rp-done .rp-dot{width:15px;height:15px;left:-22px;background:#397fc8;border-color:#397fc8;color:#fff;display:grid;place-items:center}.rp-a .rp-done .rp-dot svg{width:11px;height:11px}.rp-a .rp-done .rp-sub{color:#286ebc}</style>
</head>
<body><div class="app"><header><div class="brand"><img src="ryadom-logo.svg" alt=""><span id="brand">Рядом</span></div><nav class="languages" aria-label="Язык / Language"><button data-lang="ru" aria-pressed="true">RU</button><button data-lang="en" aria-pressed="false">EN</button></nav></header><main id="main"></main></div>
<script>
let lang='ru', answer='', boundary=false;
const words={ru:{brand:'Рядом',title:'Ваш план<br>для жизни и учебы<br><em>в России</em>',lead:'Поможем разобраться, что делать до приезда и после. Шаг за шагом, с учетом вашей ситуации.',plan:'Так выглядит ваш маршрут',example:'Пример',before:'Подготовить документы к поездке',current:'Узнать порядок заселения',next:'Куда обратиться и что подготовить',study:'Найти контакты своего вуза',note:'Ваш этап и действия определим по ответам.',intro:'<strong>Начнем с 4 коротких вопросов</strong><br>Узнаем, на каком вы этапе, и соберем персональный план действий.',cta:'Составить мой план',back:'Назад',first:'Ваш первый план',count:'Вопрос 1 из 4',question:'Вы уже приехали в Россию?',hint:'Начнем с того, что важно для вас сейчас.',a:'Готовлюсь к приезду',aa:'Хочу понять, что сделать до поездки',b:'Я уже в России',bb:'Нужны следующие шаги после въезда',info:'Покажем действия для вашей ситуации.',continue:'Продолжить',change:'Ответ можно изменить, вернувшись назад.',boundary:'Это конец прототипа приветствия. В приложении дальше откроется вопрос о вузе, затем — о въезде и жилье.'},en:{brand:'Ryadom',title:'Your plan for<br>life and study<br><em>in Russia</em>',lead:'Know what to do before and after arrival. Step by step, tailored to your situation.',plan:'Your roadmap at a glance',example:'Example',before:'Prepare your travel documents',current:'Find out how to move into your dorm',next:'Who to contact and what to prepare',study:'Find your university contacts',note:'Your answers will help us find your stage and actions.',intro:'<strong>Start with 4 quick questions</strong><br>Tell us where you are on your journey. We’ll build a personal action plan for you.',cta:'Build my plan',back:'Back',first:'Your first roadmap',count:'Question 1 of 4',question:'Have you arrived in Russia?',hint:'Let’s start with what matters to you now.',a:'Preparing to arrive',aa:'Find out what to do before the trip',b:'I am already in Russia',bb:'Find your next steps after arrival',info:'We’ll show actions for your circumstances.',continue:'Continue',change:'Go back whenever you need to change an answer.',boundary:'This is the end of the welcome prototype. In the app, the next questions cover your university, entry type and accommodation.'}};

const previewCopy={ru:{title:'Так выглядит ваш маршрут',example:'Пример',stages:['До приезда','После приезда','Во время учебы'],done:'Завершено в примере',now:'Текущий этап в примере',next:'Следующий шаг',task:'Обратиться в офис после приезда',help:'Контакты офиса и порядок обращения',note:'Ваш этап и действия определим по ответам.',sample:'Пример действия',tasks:['Проверить документы въезда','Обратиться в офис после приезда','Передать документы для продления визы'],hints:['Какие документы проверить перед поездкой','Контакты офиса и порядок обращения','Список документов и порядок подачи'],tap:'Нажмите на этап, чтобы увидеть пример.'},en:{title:'Your roadmap at a glance',example:'Example',stages:['Before arrival','After arrival','During your studies'],done:'Completed in this example',now:'Current stage in this example',next:'Next step',task:'Contact the office after arrival',help:'Office contacts and how to get in touch',note:'Your answers will help us find your stage and actions.',sample:'Example task',tasks:['Check entry documents','Contact the office after arrival','Submit visa extension documents'],hints:['What to check before your trip','Office contacts and how to get in touch','Documents to prepare and how to submit'],tap:'Select a stage to see an example.'}};
const rpPaths=['<path d="m21 3-6 18-4-8-8-4 18-6ZM11 13l5-5"/>','<path d="m3 10 9-7 9 7v10H3zM9 20v-7h6v7"/>','<path d="m2 9 10-6 10 6-10 6L2 9Zm4 3v6l6 3 6-3v-6m4-3v9"/>'];
const rpIcon=i=>`<span class="rp-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${rpPaths[i]}</svg></span>`;
function routePreview(){const p=previewCopy[lang];const head=`<div class="rp-head"><h2>${p.title}</h2><span class="rp-badge">${p.example}</span></div>`;const foot=`<p class="rp-foot">${p.note}</p>`;const action=`<div class="rp-action"><span class="rp-label">${p.next}</span><h3>${p.task}</h3></div>`;
return `<section class="rp rp-a" aria-label="${p.example}">${head}${action}<ol class="rp-list">${p.stages.map((s,i)=>`<li class="rp-row ${i===0?'rp-done':i===1?'rp-on':''}"><span class="rp-dot" aria-hidden="true">${i===0?'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 8 2.5 2.5L12 5"/></svg>':''}</span>${rpIcon(i)}<span class="rp-stage">${s}${i===1?`<small class="rp-sub">${p.now}</small>`:''}</span></li>`).join('')}</ol>${foot}</section>`;
}
if(new URLSearchParams(location.search).get('block')==='1')document.documentElement.classList.add('block-only');

function render(focus=false){const t=words[lang], quiz=location.hash==='#question';document.documentElement.lang=lang;document.getElementById('brand').textContent=t.brand;document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));const main=document.getElementById('main');main.className=quiz?'question':'';main.innerHTML=quiz?`<button class="back" id="back">${t.back}</button><div class="meta"><span>${t.first}</span><span>${t.count}</span></div><div class="progress" aria-hidden="true"><i></i><i></i><i></i><i></i></div><h1 tabindex="-1">${t.question}</h1><p class="lead">${t.hint}</p><fieldset class="options"><legend class="sr-only">${t.question}</legend>${[['planned',t.a,t.aa],['arrived',t.b,t.bb]].map(([v,a,b])=>`<label class="option"><input type="radio" name="arrival" value="${v}" ${answer===v?'checked':''}><span><strong>${a}</strong><small>${b}</small></span></label>`).join('')}</fieldset><p class="hint">${t.info}</p><div id="boundary" role="status">${boundary?`<p class="boundary">${t.boundary}</p>`:''}</div><div class="footer"><button class="primary" id="continue" ${answer?'':'disabled'}>${t.continue}</button><p class="footnote">${t.change}</p></div>`:`<h1 tabindex="-1">${t.title}</h1>${routePreview()}<p class="intro">${t.intro}</p><div class="footer"><button class="primary" id="start">${t.cta}</button></div>`;
if(quiz){document.getElementById('back').onclick=()=>{location.hash='welcome'};main.querySelectorAll('input').forEach(input=>input.onchange=()=>{answer=input.value;boundary=false;document.getElementById('continue').disabled=false;document.getElementById('boundary').innerHTML=''});document.getElementById('continue').onclick=()=>{boundary=true;document.getElementById('boundary').innerHTML=`<p class="boundary">${t.boundary}</p>`}}else document.getElementById('start').onclick=()=>{location.hash='question'};if(focus){main.querySelector('h1').focus({preventScroll:true});window.scrollTo(0,0)}}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});window.addEventListener('hashchange',()=>render(true));render();
</script></body></html>
